services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: sample-webapi-aspnetcore:local
    container_name: sample-webapi-aspnetcore
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
